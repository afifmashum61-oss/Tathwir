<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Squircle Outer Box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="10"/>

  <g transform="translate(106, 120)">
    <!-- Open Book Left Page -->
    <path d="M150 230 C90 205 35 215 10 225 V55 C35 45 90 35 150 60 Z" 
          fill="#ffffff" fill-opacity="0.96"/>
    
    <!-- Open Book Right Page -->
    <path d="M150 230 C210 205 265 215 290 225 V55 C265 45 210 35 150 60 Z" 
          fill="#ffffff" fill-opacity="0.88"/>

    <!-- Spine -->
    <path d="M150 60 V230" stroke="#0d9488" stroke-width="12" stroke-linecap="round"/>

    <!-- Left Page Lines -->
    <line x1="45" y1="95" x2="115" y2="88" stroke="#0f766e" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
    <line x1="45" y1="130" x2="115" y2="123" stroke="#0f766e" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
    <line x1="45" y1="165" x2="95" y2="158" stroke="#0f766e" stroke-width="10" stroke-linecap="round" opacity="0.35"/>

    <!-- Right Page Lines -->
    <line x1="185" y1="88" x2="255" y2="95" stroke="#0f766e" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
    <line x1="185" y1="123" x2="255" y2="130" stroke="#0f766e" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
    <line x1="185" y1="158" x2="235" y2="165" stroke="#0f766e" stroke-width="10" stroke-linecap="round" opacity="0.35"/>

    <!-- AI Sparkle 4-Point Star -->
    <path d="M250 5 C250 30 265 45 290 45 C265 45 250 60 250 85 C250 60 235 45 210 45 C235 45 250 30 250 5 Z" 
          fill="url(#sparkleGrad)" filter="url(#glow)"/>

    <!-- Secondary Sparkle -->
    <path d="M55 15 C55 25 63 33 73 33 C63 33 55 41 55 51 C55 41 47 33 37 33 C47 33 55 25 55 15 Z" 
          fill="url(#sparkleGrad)" opacity="0.9"/>
  </g>
</svg>
